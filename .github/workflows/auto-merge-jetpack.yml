name: Check Jetpack Release Version

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  check_version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The PR merge history includes both event base and head commits.
          fetch-depth: 0
          persist-credentials: false

      # Diagnostics go to the job summary, including for fork PRs. Release
      # branches and CODEOWNER approval remain manual, as in the PR checklist.
      - name: Validate Jetpack release
        run: python3 .github/scripts/check_jetpack_release.py
